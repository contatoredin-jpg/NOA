workflows:
  noa-ios:
    name: NOA iPhone (sem assinatura)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependencias
        script: |
          npm install --legacy-peer-deps
          npx expo install react react-native expo-status-bar expo-speech-recognition expo-sqlite expo-notifications expo-speech -- --legacy-peer-deps
      - name: Gerar projeto iOS
        script: npx expo prebuild --platform ios --clean --no-install
      - name: Tirar permissao de push
        script: |
          for f in ios/*/*.entitlements; do
            /usr/libexec/PlistBuddy -c "Delete :aps-environment" "$f" || true
          done
      - name: Instalar CocoaPods
        script: cd ios && pod install
      - name: Compilar sem assinatura
        script: |
          WS=$(ls -d ios/*.xcworkspace | head -n1)
          SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/NOA.xcarchive -quiet archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Montar NOA.ipa
        script: |
          mkdir -p Payload
          cp -R build/NOA.xcarchive/Products/Applications/*.app Payload/
          zip -qry NOA.ipa Payload
    artifacts:
      - NOA.ipa
